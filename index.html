<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#111c27"><meta name="apple-mobile-web-app-capable" content="yes"><title>RIDGELINE — Offroad Trials</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111c27;color:white;font-family:system-ui,-apple-system,Segoe UI,sans-serif;touch-action:none}canvas{display:block;width:100%;height:100%}button{font:inherit;touch-action:none;user-select:none;-webkit-user-select:none}#hud{position:absolute;top:max(12px,env(safe-area-inset-top));left:14px;right:14px;display:flex;align-items:flex-start;justify-content:space-between;pointer-events:none;text-shadow:0 2px 6px #0009}#brand{font-size:12px;letter-spacing:3px;font-weight:900;color:#f5ce7a}#meters{font-size:28px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1.15}#speed{font-size:12px;color:#c9d7df}#rightHud{text-align:right;font-size:12px;font-weight:750}#fuelOuter{height:8px;width:120px;border-radius:8px;background:#0008;border:1px solid #ffffff55;overflow:hidden;margin-top:6px;margin-left:auto}#fuelBar{height:100%;width:100%;background:linear-gradient(90deg,#ff6c4c,#ffd277,#9ee69d)}#coins{color:#ffd46c;margin-top:7px}#pause{position:absolute;top:max(14px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);border:1px solid #ffffff55;border-radius:12px;background:#0c1b2caa;color:white;padding:8px 13px;z-index:5}#controls{position:absolute;bottom:max(16px,env(safe-area-inset-bottom));left:12px;right:12px;display:flex;justify-content:space-between;align-items:flex-end;pointer-events:none}#controls .cluster{display:flex;gap:9px;align-items:flex-end}.ctrl{pointer-events:auto;width:72px;height:72px;border-radius:22px;background:linear-gradient(160deg,#344d62db,#132434ee);border:2px solid #b4d5e055;color:#fff;font-weight:900;font-size:14px;box-shadow:0 6px 20px #0008;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:1px}.ctrl small{font-size:10px;font-weight:600;color:#b8cdd6}.ctrl:active,.ctrl.active{background:linear-gradient(160deg,#ffc668,#bd642e);color:#152331;border-color:#ffe2a2}.ctrl.gas{height:96px;width:88px;border-radius:25px;background:linear-gradient(160deg,#ef9d48,#a54b2e);border-color:#ffd38c;color:#fff}.ctrl.gas:active,.ctrl.gas.active{background:linear-gradient(160deg,#ffcf7b,#eb833f)}#toast{position:absolute;top:24%;left:50%;transform:translateX(-50%);font-size:17px;font-weight:900;text-align:center;text-shadow:0 2px 9px #000;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}#overlay{position:absolute;inset:0;background:linear-gradient(160deg,#07121bdc,#102334e8);display:flex;align-items:center;justify-content:center;z-index:10;padding:18px;overflow:auto}#panel{max-width:480px;width:100%;border:1px solid #a3bdc13b;background:#15293beb;border-radius:22px;padding:24px;text-align:center;box-shadow:0 20px 80px #0009}#panel h1{font-size:clamp(30px,8vw,49px);margin:4px 0 0;letter-spacing:3px;color:#f3c77c}#panel h2{margin:0 0 9px}#panel p{color:#bdced9;line-height:1.5;font-size:14px}#panel .eyebrow{font-size:11px;letter-spacing:4px;color:#b1d8d8;font-weight:900}#panel .primary{background:linear-gradient(140deg,#ffd187,#e98846);color:#182432;border:0;padding:14px 22px;border-radius:12px;font-weight:900;width:100%;margin-top:12px;font-size:16px}#panel .secondary{background:#273d4c;color:white;border:1px solid #ffffff3d;padding:11px;border-radius:10px;margin:6px 3px 0}#upgrades{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px}#upgrades button{background:#223c4c;border:1px solid #65838b88;color:#fff;border-radius:12px;padding:12px 6px;text-align:center;font-size:12px}#upgrades button strong{display:block;font-size:15px;color:#f6d08a}#upgrades button:disabled{opacity:.4}#upgrades button .cost{color:#ffd07b;font-size:11px}#tip{font-size:11px;color:#aabec8;margin-top:10px}#progress{position:absolute;bottom:max(126px,calc(env(safe-area-inset-bottom) + 126px));left:50%;transform:translateX(-50%);width:min(280px,44vw);height:5px;background:#0008;border-radius:9px;pointer-events:none;overflow:hidden}#progressFill{width:0;height:100%;background:#f2ca78}#landscape{position:absolute;bottom:125px;left:50%;transform:translateX(-50%);font-size:11px;color:#fff9;pointer-events:none;display:none}@media(max-width:700px){#hud{left:10px;right:10px}#meters{font-size:23px}#rightHud{font-size:11px}.ctrl{width:62px;height:68px;border-radius:18px}.ctrl.gas{width:79px;height:88px}#progress{bottom:114px}#panel{padding:19px}#landscape{display:block}}@media(max-height:420px){#panel{padding:12px}#panel h1{font-size:30px}#panel p{margin:5px 0;font-size:12px}#upgrades{margin-top:5px}#upgrades button{padding:7px}#controls{bottom:8px}.ctrl{height:58px;width:60px}.ctrl.gas{height:66px;width:75px}#progress{bottom:82px}#landscape{display:none}}
</style></head><body><canvas id="game"></canvas><div id="hud"><div><div id="brand">RIDGELINE / TRIALS</div><div id="meters">0 m</div><div id="speed">0 km/h · GEAR 1</div></div><div id="rightHud"><div>FUEL <span id="fuelText">100%</span></div><div id="fuelOuter"><div id="fuelBar"></div></div><div id="coins">◈ 0</div><div id="condition">TRUCK 100%</div></div></div><button id="pause">Ⅱ</button><div id="progress"><div id="progressFill"></div></div><div id="toast"></div><div id="landscape">Rotate for a wider view</div><div id="controls"><div class="cluster"><button class="ctrl" data-key="brake">BRAKE<small>REVERSE</small></button><button class="ctrl" data-key="left">↶<small>LEAN</small></button><button class="ctrl" data-key="right">↷<small>LEAN</small></button></div><div class="cluster"><button class="ctrl gas" data-key="gas">GAS<small>HOLD</small></button></div></div><div id="overlay"><div id="panel"></div></div><script>
(()=>{'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d',{alpha:false});let W=0,H=0,dpr=1,unit=1,camX=0,camY=0,clock=0,last=0,mode='menu',toastTimer=0,particles=[],floaters=[],coins=[],pickups=[],decor=[],finish=6200,seed=42,terrain=[],best=Number(localStorage.getItem('ridgelineBest')||0);const $=id=>document.getElementById(id);const keys={gas:false,brake:false,left:false,right:false};const U={engine:0,tires:0,suspension:0,tank:0};let money=0,truck,checkpoint=0,respawns=0,night=0,checkpointAt=0;
function rand(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}function rnd(a,b){return a+(b-a)*rand()}function clamp(v,a,b){return Math.max(a,Math.min(b,v))}function mix(a,b,t){return a+(b-a)*t}function smooth(t){return t*t*(3-2*t)}function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);unit=Math.min(W/430,H/690)*1.05;unit=clamp(unit,.68,1.35)}addEventListener('resize',resize);resize();
function build(){seed=42;terrain=[];const step=28;let y=0;for(let x=0;x<=finish+1300;x+=step){let base= Math.sin(x*.0043)*68+Math.sin(x*.0091+1.7)*29+Math.sin(x*.0013+2)*75;let bump=Math.sin(x*.024)*12;let jump=0;for(const j of [710,1320,1960,2690,3420,4140,5050,5720]){const dx=x-j;if(dx>-155&&dx<60){const p=(dx+155)/215;jump+=p<.68?-p*96:(p-.68)/.32*140-65}}y=base+bump+jump;terrain.push({x,y})}coins=[];pickups=[];decor=[];for(let x=220;x<finish-50;x+=rnd(100,180)){let ground=groundY(x);if(rand()<.72)coins.push({x,y:ground-rnd(65,115),taken:false,phase:rand()*6.28})}for(let x=480;x<finish-200;x+=rnd(580,850)){pickups.push({x,y:groundY(x)-85,type:rand()<.54?'fuel':rand()<.65?'repair':'upgrade',taken:false})}for(let x=100;x<finish+400;x+=rnd(45,125)){decor.push({x,type:rand()<.42?'pine':rand()<.5?'rock':'shrub',scale:rnd(.6,1.6),side:rand()})}}
function groundY(x){if(x<=0)return terrain[0].y;let i=Math.floor(x/28);if(i>=terrain.length-1)return terrain[terrain.length-1].y;let t=(x-terrain[i].x)/28;return mix(terrain[i].y,terrain[i+1].y,smooth(t))}function slope(x){return (groundY(x+5)-groundY(x-5))/10}
function resetTruck(x=40){truck={x,y:groundY(x)-60,vx:0,vy:0,a:Math.atan(slope(x)),av:0,fuel:100,hp:100,air:0,flip:0,wheel:0,distance:x,combo:0};checkpointAt=x}
function newGame(){build();money=0;Object.keys(U).forEach(k=>U[k]=0);checkpoint=0;respawns=0;particles=[];floaters=[];night=0;resetTruck();mode='play';$('overlay').style.display='none';toast('REACH THE SUMMIT · 6,200 m');}
function menu(title='RIDGELINE',subtitle='OFFROAD TRIALS'){mode='menu';$('overlay').style.display='flex';$('panel').innerHTML=`<div class="eyebrow">A HILL-CLIMB ADVENTURE</div><h1>${title}</h1><div class="eyebrow">${subtitle}</div><p>Climb rugged hills, launch huge jumps, collect scrap and upgrade your truck. Keep your fuel topped up and land on your wheels.</p><p><b>Controls:</b> GAS / BRAKE to drive, ↶ / ↷ to rotate in mid-air. On desktop: arrows or WASD.</p><p>🏁 6,200 m finish · ◈ Upgrade pickups · ⛽ Fuel cans</p><button class="primary" id="start">START ENGINE</button><div id="tip">Best distance: ${Math.floor(best)} m · Progress is saved locally</div>`;$('start').onclick=newGame}
function upgradeCost(k){return [35,50,65,75][['engine','tires','suspension','tank'].indexOf(k)]*(U[k]+1)}function upgrade(k){let cost=upgradeCost(k);if(money>=cost&&U[k]<4){money-=cost;U[k]++;toast(`${k.toUpperCase()} LEVEL ${U[k]}`);renderPause();}}
function renderPause(){mode='pause';$('overlay').style.display='flex';let buttons=Object.entries({engine:['ENGINE','More climbing power'],tires:['GRIP','Better traction'],suspension:['SUSPENSION','Softer landings'],tank:['FUEL TANK','More fuel efficiency']}).map(([k,v])=>`<button data-upgrade="${k}" ${money<upgradeCost(k)||U[k]>=4?'disabled':''}><strong>${v[0]} ${U[k]}/4</strong>${v[1]}<div class="cost">${U[k]>=4?'MAXED':'◈ '+upgradeCost(k)}</div></button>`).join('');$('panel').innerHTML=`<div class="eyebrow">GARAGE / PIT STOP</div><h2>TRUCK UPGRADES</h2><p>Scrap available: <b style="color:#ffd07b">◈ ${money}</b><br>Upgrade anytime. The world pauses while you're here.</p><div id="upgrades">${buttons}</div><button class="primary" id="resume">CONTINUE DRIVING</button><button class="secondary" id="restart">RESTART RUN</button>`;$('resume').onclick=()=>{mode='play';$('overlay').style.display='none'};$('restart').onclick=()=>menu();document.querySelectorAll('[data-upgrade]').forEach(b=>b.onclick=()=>upgrade(b.dataset.upgrade))}
function end(win=false){mode='end';$('overlay').style.display='flex';best=Math.max(best,truck.distance);localStorage.setItem('ridgelineBest',best);$('panel').innerHTML=`<div class="eyebrow">${win?'MISSION COMPLETE':'END OF THE ROAD'}</div><h1>${win?'SUMMIT!':'WRECKED'}</h1><p>${win?'You conquered the entire ridgeline.':'Your truck can’t continue.'}</p><p><b>Distance:</b> ${Math.floor(truck.distance)} m<br><b>Scrap collected:</b> ◈ ${money}<br><b>Best:</b> ${Math.floor(best)} m</p><button class="primary" id="again">PLAY AGAIN</button>`;$('again').onclick=newGame}
function toast(s){$('toast').textContent=s;$('toast').style.opacity=1;toastTimer=2.2}
function spawn(x,y,color,n=8,power=1){for(let i=0;i<n;i++)particles.push({x,y,vx:rnd(-95,95)*power,vy:rnd(-130,10)*power,life:rnd(.3,.8),max:.8,color,r:rnd(1.4,4)})}
function update(dt){clock+=dt;if(mode!=='play')return;dt=Math.min(dt,.035);const t=truck;night=(Math.sin(clock*.028-1.4)+1)/2;const wheelBase=79,rad=18;const cos=Math.cos(t.a),sin=Math.sin(t.a);let contacts=0,normal=0,impact=0;const wheelPositions=[];for(let side of [-1,1]){let wx=t.x+side*wheelBase*.5*cos+23*-sin,wy=t.y+side*wheelBase*.5*sin+23*cos;let g=groundY(wx);let penetration=wy+rad-g;wheelPositions.push({x:wx,y:wy,g,p:penetration,side});if(penetration>0){contacts++;normal+=penetration;impact=Math.max(impact,t.vy+side*t.av*wheelBase*.5*cos);const spring=(270+U.suspension*68)*penetration;const damp=31+U.suspension*8;let f=clamp(spring-(t.vy+side*t.av*wheelBase*.5*cos)*damp,0,16500);t.vy-=f*dt/115;t.av-=side*f*dt*.00009;t.y-=penetration*.08;}}
const onGround=contacts>0;let power=U.engine*55+250,grip=.85+U.tires*.13;if(keys.gas&&t.fuel>0){let accel=power*(onGround?grip:.17);t.vx+=accel*dt*(onGround?1:.3);t.fuel-=dt*(.85-U.tank*.13);if(onGround&&Math.random()<.27)spawn(t.x-42,t.y+34,'#c1b6a0',2,.38)}if(keys.brake){if(t.vx>12)t.vx-=360*dt;else t.vx-=155*dt;}if(!keys.gas&&onGround)t.vx*=Math.exp(-1.05*dt);t.vx-=Math.sin(Math.atan(slope(t.x)))*110*dt*(onGround?1:.12);t.vx=clamp(t.vx,-125,420+U.engine*45);t.vy+=720*dt;t.vy=clamp(t.vy,-750,1100);if(onGround){const desired=Math.atan(slope(t.x));let da=Math.atan2(Math.sin(desired-t.a),Math.cos(desired-t.a));t.av+=da*(12+U.suspension*2)*dt;t.av*=Math.exp(-4.8*dt);t.air=0;t.flip=0}else{t.air+=dt;t.av+=((keys.right?1:0)-(keys.left?1:0))*3.6*dt;t.av*=Math.exp(-.18*dt)}if(onGround){t.av+=((keys.right?1:0)-(keys.left?1:0))*.65*dt}t.x+=t.vx*dt;t.y+=t.vy*dt;t.a+=t.av*dt;t.wheel+=t.vx*dt/rad;t.x=Math.max(0,t.x);if(t.x===0)t.vx=Math.max(0,t.vx);t.distance=Math.max(t.distance,t.x);if(t.y>groundY(t.x)+200){t.hp=0}if(onGround&&impact>360){let dmg=Math.max(0,(impact-360)/18)*(1-U.suspension*.12);t.hp-=dmg;spawn(t.x,t.y+30,'#d8a16a',Math.floor(8+dmg),.9);if(dmg>6)toast(`HARD LANDING · -${Math.round(dmg)} HP`)}if(onGround&&Math.abs(Math.atan2(Math.sin(t.a),Math.cos(t.a)))>2.15){t.flip+=dt;if(t.flip>.85){t.hp-=dt*80;if(t.flip>2.4)t.hp=0}}if(t.fuel<=0){t.fuel=0;if(Math.abs(t.vx)<8)t.hp-=dt*18}t.hp=clamp(t.hp,0,100);t.fuel=clamp(t.fuel,0,100);
for(const c of coins){if(!c.taken&&Math.abs(t.x-c.x)<44&&Math.abs(t.y-c.y)<73){c.taken=true;money+=10;spawn(c.x,c.y,'#ffcf66',8,.6)}}for(const p of pickups){if(!p.taken&&Math.abs(t.x-p.x)<55&&Math.abs(t.y-p.y)<86){p.taken=true;if(p.type==='fuel'){t.fuel=clamp(t.fuel+38,0,100);toast('FUEL +38%');spawn(p.x,p.y,'#9ee5a5',12)}else if(p.type==='repair'){t.hp=clamp(t.hp+36,0,100);toast('REPAIRED +36%');spawn(p.x,p.y,'#8ccbf3',12)}else{money+=35;toast('UPGRADE CACHE · ◈ +35');spawn(p.x,p.y,'#ffd179',12)}}}if(t.x>checkpoint+1100){checkpoint=Math.floor(t.x/1100)*1100;toast(`CHECKPOINT ${Math.floor(checkpoint)} m`)}if(t.x>=finish){end(true)}else if(t.hp<=0)end(false);if(t.distance>best){best=t.distance;localStorage.setItem('ridgelineBest',Math.floor(best))}camX=mix(camX,t.x-W*.33,clamp(dt*3,0,1));camY=mix(camY,t.y- H*.55,clamp(dt*1.5,0,1));for(let i=particles.length-1;i>=0;i--){let p=particles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=260*dt;p.life-=dt;if(p.life<=0)particles.splice(i,1)}if(toastTimer>0){toastTimer-=dt;if(toastTimer<=0)$('toast').style.opacity=0}updateHud()}
function updateHud(){const t=truck;$('meters').textContent=`${Math.floor(t.distance)} m`;$('speed').textContent=`${Math.max(0,Math.round(Math.abs(t.vx)*.27))} km/h · GEAR ${Math.min(5,Math.floor(Math.abs(t.vx)/90)+1)}`;$('fuelText').textContent=`${Math.round(t.fuel)}%`;$('fuelBar').style.width=t.fuel+'%';$('coins').textContent=`◈ ${money}`;$('condition').textContent=`TRUCK ${Math.round(t.hp)}%`;$('progressFill').style.width=clamp(t.distance/finish*100,0,100)+'%'}
function path(points,fill,stroke,width=1){ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));if(fill){ctx.closePath();ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=width;ctx.stroke()}}
function drawSky(){const sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#28485e');sky.addColorStop(.58,'#789eab');sky.addColorStop(1,'#f3c991');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);let sunX=W*.76-Math.sin(clock*.03)*W*.35,sunY=H*.22+Math.sin(clock*.03)*H*.12;const glow=ctx.createRadialGradient(sunX,sunY,5,sunX,sunY,160);glow.addColorStop(0,'#fff1bfaa');glow.addColorStop(1,'#ffe9b000');ctx.fillStyle=glow;ctx.fillRect(sunX-160,sunY-160,320,320);ctx.fillStyle='#ffe8b6';ctx.beginPath();ctx.arc(sunX,sunY,26,0,7);ctx.fill();for(let layer=0;layer<3;layer++){const par=[.1,.22,.38][layer],baseline=H*[.57,.65,.73][layer],ampl=[55,76,95][layer];ctx.beginPath();ctx.moveTo(-20,H);for(let x=-20;x<=W+25;x+=12){let world=x+camX*par;let yy=baseline+Math.sin(world*.003+layer)*ampl+Math.sin(world*.008+layer*2)*ampl*.35;ctx.lineTo(x,yy)}ctx.lineTo(W+25,H);ctx.closePath();ctx.fillStyle=['#638d98','#477482','#355d65'][layer];ctx.fill()}}
function terrainScreen(x){return groundY(x)-camY}function drawTerrain(){let start=Math.floor((camX-80)/14)*14,end=camX+W+90;ctx.beginPath();ctx.moveTo(start-camX,H+100);for(let x=start;x<=end;x+=9)ctx.lineTo(x-camX,terrainScreen(x));ctx.lineTo(end-camX,H+100);ctx.closePath();const dirt=ctx.createLinearGradient(0,H*.4,0,H);dirt.addColorStop(0,'#665240');dirt.addColorStop(1,'#2e2c28');ctx.fillStyle=dirt;ctx.fill();ctx.beginPath();for(let x=start;x<=end;x+=7){let sx=x-camX,sy=terrainScreen(x);if(x===start)ctx.moveTo(sx,sy);else ctx.lineTo(sx,sy)}ctx.strokeStyle='#8a9765';ctx.lineWidth=10;ctx.stroke();ctx.strokeStyle='#b3a477';ctx.lineWidth=3;ctx.stroke();ctx.save();ctx.beginPath();ctx.rect(0,0,W,H);ctx.clip();for(let x=Math.floor(start/40)*40;x<end;x+=40){let y=terrainScreen(x)+12;ctx.strokeStyle='#c1a17c25';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x-camX,y);ctx.lineTo(x-camX+16,y+8);ctx.stroke()}ctx.restore()}
function drawDecor(){for(const d of decor){let sx=d.x-camX;if(sx<-80||sx>W+80)continue;let sy=terrainScreen(d.x),s=d.scale;if(d.type==='pine'){ctx.fillStyle='#423d30';ctx.fillRect(sx-3*s,sy-43*s,6*s,44*s);for(let k=0;k<3;k++){path([[sx,sy-(94-k*19)*s],[sx-(24-k*3)*s,sy-(32+k*5)*s],[sx+(24-k*3)*s,sy-(32+k*5)*s]],['#254d42','#30604d','#39705a'][k])}}else if(d.type==='rock'){path([[sx-18*s,sy],[sx-12*s,sy-11*s],[sx+6*s,sy-16*s],[sx+19*s,sy-3*s],[sx+18*s,sy]],'#6e7068','#92948a',1.5)}else{ctx.fillStyle='#4c6b4c';for(let k=0;k<4;k++){ctx.beginPath();ctx.ellipse(sx+(k-1.5)*7*s,sy-7*s,9*s,11*s,0,0,7);ctx.fill()}}}}
function drawCollectibles(){for(const c of coins){if(c.taken)continue;let x=c.x-camX,y=c.y-camY+Math.sin(clock*3+c.phase)*5;if(x<-30||x>W+30)continue;ctx.save();ctx.translate(x,y);ctx.scale(.8+.2*Math.cos(clock*4+c.phase),1);ctx.shadowColor='#ffdb76';ctx.shadowBlur=14;ctx.fillStyle='#ffd46b';ctx.beginPath();ctx.arc(0,0,10,0,7);ctx.fill();ctx.shadowBlur=0;ctx.strokeStyle='#fff1b5';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,0,6,0,7);ctx.stroke();ctx.fillStyle='#946021';ctx.font='bold 12px system-ui';ctx.textAlign='center';ctx.fillText('◈',0,4);ctx.restore()}for(const p of pickups){if(p.taken)continue;let x=p.x-camX,y=p.y-camY+Math.sin(clock*2+p.x)*4;if(x<-40||x>W+40)continue;ctx.save();ctx.translate(x,y);ctx.shadowColor=p.type==='fuel'?'#b3ffb5':p.type==='repair'?'#8fcaff':'#ffd378';ctx.shadowBlur=18;ctx.fillStyle=p.type==='fuel'?'#5cbf85':p.type==='repair'?'#68a9da':'#dfaa55';ctx.fillRect(-16,-18,32,36);ctx.shadowBlur=0;ctx.strokeStyle='#e7f2ed';ctx.lineWidth=2;ctx.strokeRect(-16,-18,32,36);ctx.fillStyle='white';ctx.font='bold 19px system-ui';ctx.textAlign='center';ctx.fillText(p.type==='fuel'?'⛽':p.type==='repair'?'+':'⚙',0,7);ctx.restore()}}
function drawTruck(){const t=truck;let x=t.x-camX,y=t.y-camY;ctx.save();ctx.translate(x,y);ctx.rotate(t.a);const suspension=U.suspension;ctx.strokeStyle='#1d2527';ctx.lineWidth=7;for(let side of [-1,1]){let wx=side*40,wy=24;ctx.beginPath();ctx.moveTo(side*32,4);ctx.lineTo(wx,wy);ctx.stroke();ctx.strokeStyle='#d5b75d';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(side*32,7);ctx.lineTo(wx,wy-4);ctx.stroke()}ctx.fillStyle='#1b2327';ctx.fillRect(-60,3,120,17);ctx.fillStyle='#bc693f';path([[-57,-6],[-52,-24],[-18,-26],[-7,-48],[31,-48],[49,-21],[59,-15],[62,5],[-60,5]],'#b95d39','#e5a96a',2);path([[-3,-42],[28,-42],[43,-22],[-6,-22]],'#a2d1d2','#e1c7a0',2);ctx.strokeStyle='#d7e4dc';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(22,-42);ctx.lineTo(22,-22);ctx.stroke();ctx.fillStyle='#e1bd80';ctx.fillRect(-53,-19,31,5);ctx.fillStyle='#e8e1c3';ctx.fillRect(53,-13,9,8);ctx.fillStyle='#cfd9d2';ctx.fillRect(-62,-9,7,9);ctx.fillStyle='#29353b';ctx.fillRect(-4,-16,4,13);ctx.fillStyle='#ffd88d';ctx.fillRect(24,-18,9,3);for(let side of [-1,1]){let wx=side*40,wy=24;ctx.save();ctx.translate(wx,wy);ctx.rotate(t.wheel);ctx.fillStyle='#10171b';ctx.beginPath();ctx.arc(0,0,21,0,7);ctx.fill();ctx.strokeStyle='#3b4445';ctx.lineWidth=5;ctx.stroke();for(let i=0;i<12;i++){ctx.rotate(Math.PI/6);ctx.fillStyle='#626c68';ctx.fillRect(-3,-22,6,5)}ctx.fillStyle='#a6a9a3';ctx.beginPath();ctx.arc(0,0,10,0,7);ctx.fill();ctx.fillStyle='#596366';for(let i=0;i<5;i++){let a=i*Math.PI*2/5;ctx.beginPath();ctx.arc(Math.cos(a)*6,Math.sin(a)*6,2,0,7);ctx.fill()}ctx.restore()}ctx.restore();if(keys.gas&&t.fuel>0&&Math.random()<.65){particles.push({x:t.x-60,y:t.y-9,vx:rnd(-95,-15),vy:rnd(-40,0),life:rnd(.3,.6),max:.6,color:'#a4b0ad',r:rnd(2,5)})}}
function draw(){drawSky();drawDecor();drawTerrain();drawCollectibles();drawTruck();for(const p of particles){let a=clamp(p.life/p.max,0,1);ctx.globalAlpha=a;ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x-camX,p.y-camY,p.r*(1.3-a*.3),0,7);ctx.fill()}ctx.globalAlpha=1;const darkness=night*.28;if(darkness>0){ctx.fillStyle=`rgba(7,18,37,${darkness})`;ctx.fillRect(0,0,W,H)}if(mode==='play'&&truck.x>finish-450){let x=finish-camX,y=terrainScreen(finish);ctx.fillStyle='#dbe3d9';ctx.fillRect(x,y-110,5,110);for(let i=0;i<4;i++)for(let j=0;j<4;j++){ctx.fillStyle=(i+j)%2?'#1d2429':'#f4eee1';ctx.fillRect(x+5+j*10,y-110+i*10,10,10)}}}
function frame(ms){let dt=last?(ms-last)/1000:1/60;last=ms;update(dt);draw();requestAnimationFrame(frame)}
for(const b of document.querySelectorAll('[data-key]')){const k=b.dataset.key;const set=v=>{keys[k]=v;b.classList.toggle('active',v)};b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);set(true)});b.addEventListener('pointerup',e=>{e.preventDefault();set(false)});b.addEventListener('pointercancel',()=>set(false));b.addEventListener('lostpointercapture',()=>set(false))}const mapping={ArrowRight:'gas',KeyD:'gas',ArrowLeft:'brake',KeyA:'brake',ArrowUp:'left',KeyW:'left',ArrowDown:'right',KeyS:'right'};addEventListener('keydown',e=>{if(mapping[e.code]){e.preventDefault();keys[mapping[e.code]]=true}if(e.code==='Escape'||e.code==='KeyP'){if(mode==='play')renderPause();else if(mode==='pause'){$('overlay').style.display='none';mode='play'}}});addEventListener('keyup',e=>{if(mapping[e.code]){e.preventDefault();keys[mapping[e.code]]=false}});addEventListener('blur',()=>Object.keys(keys).forEach(k=>keys[k]=false));$('pause').onclick=()=>{if(mode==='play')renderPause();else if(mode==='pause'){mode='play';$('overlay').style.display='none'}};build();resetTruck();camY=truck.y-H*.55;menu();requestAnimationFrame(frame);
})();
</script></body></html>
